services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_assistant_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b}
      - MOCK_LLM=${MOCK_LLM:-false}
      - SQLITE_PATH=/app/data/runtime/university.db
      - CHROMA_PATH=/app/data/runtime/chroma
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/runtime:/app/data/runtime
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_assistant_ui
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
